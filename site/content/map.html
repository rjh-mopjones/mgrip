<h1>Map</h1>
<p>Click to set a spawn point. North is the night side, south is the day side.</p>
<div class="spawn" aria-live="polite">
  <dl>
    <div><dt>Zone</dt><dd id="spawnZone"></dd></div>
    <div><dt>Biome</dt><dd id="spawnBiome"></dd></div>
    <div><dt>Chunk</dt><dd id="spawnChunk"></dd></div>
    <div><dt>Light level</dt><dd id="spawnLight"></dd></div>
    <div><dt>Province</dt><dd id="spawnProvince"></dd></div>
    <div><dt>Faction</dt><dd id="spawnFaction"></dd></div>
    <div><dt>Seed</dt><dd id="spawnSeed"></dd></div>
  </dl>
  <button id="playButton" type="button">Play here</button>
</div>
<div class="layers" id="layers" role="radiogroup" aria-label="Map layer"></div>
<div class="map-frame" id="mapFrame" tabindex="0" role="application" aria-label="World map. Click, or use arrow keys, to move the spawn point by one chunk.">
  <img id="mapImage" src="macromap.png" width="2048" height="1024" alt="World map of Margin">
  <div class="pin" id="pin"></div>
</div>
<p class="muted" id="mapStatus"></p>

<dialog id="play" aria-labelledby="playTitle">
  <div class="play-head">
    <span id="playTitle"></span>
    <button class="plain" id="playClose" type="button">Close</button>
  </div>
  <div class="viewport"><iframe id="playFrame" title="Margin's Grip" allow="fullscreen"></iframe></div>
</dialog>
